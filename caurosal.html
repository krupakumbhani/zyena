<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Carousel</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
    crossorigin="anonymous"
  />
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"
  ></script>
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"
  />
    <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css">
    <style>
        body {
            background-color: #2f3640;
            color: #fff;
        }
        .gallery {
            width: 100%;
            max-width: 620px;
            margin: 40px auto;
            overflow: hidden;
        }
        .gallery-slider {
            width: 100%;
            height: auto;
            margin: 0 0 10px 0;
        }
        .gallery-slider .swiper-slide {
            width: auto;
            height: 400px;
        }
        .gallery-slider .swiper-slide img {
            display: block;
            width: auto;
            height: 100%;
            margin: 0 auto;
        }
        .gallery-thumbs {
            width: 100%;
            padding: 0;
            overflow: hidden;
        }
        .gallery-thumbs .swiper-slide {
            width: 100px;
            height: 100px;
            text-align: center;
            overflow: hidden;
            opacity: 0.4;
        }
        .gallery-thumbs .swiper-slide-active {
            opacity: 1;
        }
        .gallery-thumbs .swiper-slide img {
            width: auto;
            height: 100%;
        }
    </style>
</head>
<body>
    <section>
        <div class="row">
            <div class="col-lg-6">
                <div class="gallery">
                    <div class="swiper-container gallery-slider">
                        <div class="swiper-wrapper">
                            <div class="swiper-slide"><img src="//into-the-program.com/demo/images/sample010.jpg" alt="Sample Image 1"></div>
                            <div class="swiper-slide"><img src="//into-the-program.com/demo/images/sample005.jpg" alt="Sample Image 2"></div>
                            <div class="swiper-slide"><img src="//into-the-program.com/demo/images/sample012.jpg" alt="Sample Image 3"></div>
                            <div class="swiper-slide"><img src="//into-the-program.com/demo/images/sample007.jpg" alt="Sample Image 4"></div>
                            <div class="swiper-slide"><img src="//into-the-program.com/demo/images/sample008.jpg" alt="Sample Image 5"></div>
                            <div class="swiper-slide"><img src="//into-the-program.com/demo/images/sample009.jpg" alt="Sample Image 6"></div>
                        </div>
                        <div class="swiper-button-prev"></div>
                        <div class="swiper-button-next"></div>
                    </div>
            
                    <div class="swiper-container gallery-thumbs">
                        <div class="swiper-wrapper">
                            <div class="swiper-slide"><img src="//into-the-program.com/demo/images/sample010.jpg" alt="Sample Thumbnail 1"></div>
                            <div class="swiper-slide"><img src="//into-the-program.com/demo/images/sample005.jpg" alt="Sample Thumbnail 2"></div>
                            <div class="swiper-slide"><img src="//into-the-program.com/demo/images/sample012.jpg" alt="Sample Thumbnail 3"></div>
                            <div class="swiper-slide"><img src="//into-the-program.com/demo/images/sample007.jpg" alt="Sample Thumbnail 4"></div>
                            <div class="swiper-slide"><img src="//into-the-program.com/demo/images/sample008.jpg" alt="Sample Thumbnail 5"></div>
                            <div class="swiper-slide"><img src="//into-the-program.com/demo/images/sample009.jpg" alt="Sample Thumbnail 6"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-lg-6">
                hhcdfbhjj
            </div>
        </div>
    </section>
   

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Swiper/6.8.4/swiper-bundle.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            var slider = new Swiper(".gallery-slider", {
                slidesPerView: 1,
                centeredSlides: true,
                loop: true,
                loopedSlides: 6, //スライドの枚数と同じ値を指定
                navigation: {
                    nextEl: ".swiper-button-next",
                    prevEl: ".swiper-button-prev"
                }
            });

            var thumbs = new Swiper(".gallery-thumbs", {
                slidesPerView: "auto",
                spaceBetween: 10,
                centeredSlides: true,
                loop: true,
                slideToClickedSlide: true
            });

            slider.controller.control = thumbs;
            thumbs.controller.control = slider;
        });
    </script>
</body>
</html>
